name: Update observations

on:
  schedule:
    - cron: "*/5 * * * *"        # every 5 minutes
  workflow_dispatch:            # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write               # lets the job push the updated files

concurrency:
  group: update-observations    # never run two at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Fetch and process observations
        working-directory: flood_repository_2
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: |
          python flood_repository_2/py/fetch_odk.py
          python flood_repository_2/py/process_observations.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flood_repository_2/data flood_repository_2/media
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update observations"
            git pull --rebase
            git push
          fi