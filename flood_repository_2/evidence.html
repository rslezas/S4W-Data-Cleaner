<!doctype html>
<html lang="en">
  <!-- Document metadata, browser title, mobile viewport, and shared stylesheet. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="S4W Nepal Flood Repository" />
    <title>Gallery | S4W Nepal Flood Repository</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="images/favicon.png">
  </head>

  <body>

    <a class="skip" href="#main">Skip to content</a>

    <!-- Shared header -->
    <div id="site-header"></div>

    <!-- Evidence Page -->
    <main id="main">
      <!-- Page Introduction -->
      <section class="page-heading">
        <div class="wrap">
          <p class="eyebrow">EVIDENCE REPOSITORY</p>
          <h1>Stories through observation</h1>
          <p class="lead">
            Photographs, video, field notes, and reports are submitted by citizen scientists to help explain each flood event.
          </p>
        </div>
      </section>
      <section class="panel">

        <a>Gallery Filters</a>

        <div class="filter-row">

          <div>
            <label for="event-select">Select an event</label>
            <select id="event-select" class="filter-dropdown">
              <option value="event-1">All Events</option>

            </select>
          </div>

          <div>
            <label for="evidence-type">Evidence Type</label>
            <select id="evidence-type" class="filter-dropdown">
              <option value="evidence-type">All Evidence Types</option>

            </select>
          </div>

          <div>
              <label for="startDateFilter">Start date</label>
              <input type="date" id="startDateFilter" class="filter-dropdown">
          </div>

          <div>
              <label for="endDateFilter">End date</label>
              <input type="date" id="endDateFilter" class="filter-dropdown">
          </div>

          <p id="dateFilterError" role="alert" hidden></p>

        </div>

        <br>

        <section class="panel">

          <div id="gallery" class="gallery"></div>



          </div>
        </section>
      </section>
    </main>

    <!-- Shared Footer -->

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script src="js/load_data.js"></script>
    <script src="js/embed_helper.js"></script>
    <script src="js/populate_gallery_filters.js"></script>
    <script src="js/observation_filters.js"></script>
    <script src="js/populate_gallery.js"></script>
    <script src="js/shared_layout.js"></script>

  </body>
</html>
